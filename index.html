if(!d||!Number.isSafeInteger(d.revision)||d.revision<1||!Array.isArray(d.cards)||(d.cards.length<1||d.cards.length>30)||!Array.isArray(d.terms)||d.terms.length!==d.cards.length)return false;

}

try{cardDbApi=await import('https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js');cardDb=cardDbApi.getDatabase();
cardDbApi.onValue(cardDbApi.ref(cardDb,'public/cardGuideNovember2026'),snap=>{const d=snap.val();cardReadReady=true;if(d===null){cardRevision=0;return}if(!validateGuide(d)){cardReadReady=false;return}const kept=d.cards.map((c,i)=>({card:c,terms:d.terms[i]})).filter(x=>!x.card.name.includes('롯데'));novemberCards=kept.map(x=>x.card);cardTerms=kept.map(x=>x.terms);cardRevision=d.revision;refreshCardView()},()=>{cardReadReady=false})}catch{cardReadReady=false}
}
function editorField(parent,title,value,kind='text'){
