.skw-wired-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:7px 0;font-size:13px;color:#475569}
.skw-wired-line strong{font-size:16px;color:#0f172a;text-align:right;white-space:nowrap}
.skw-wired-emphasis strong{font-size:21px;color:#1d4ed8}
.skw-wired-expand{margin-top:14px;border-top:1px solid #e2e8f0;padding-top:12px}
.skw-wired-expand summary{display:block;cursor:pointer;color:#1d4ed8;background:#eff6ff;border-radius:10px;font-size:13px;font-weight:800;text-align:center;padding:12px}
.skw-wired-expand summary::marker{content:''}
.skw-wired-detailbody{padding:11px 4px 0}
.skw-wired-detailbody p{font-size:13px;line-height:1.65;color:#475569;margin:8px 0;overflow-wrap:anywhere}


/* 유선 요금정리: 검색 왼쪽 / 선택 필터 오른쪽 */
.skw-quote-fields{display:grid;gap:13px;margin:10px 0 16px}
.skw-quote-field{display:grid;gap:6px;min-width:0}
.skw-quote-field>label{font-size:14px;color:#334155;font-weight:800}
.skw-quote-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:8px}
.skw-quote-controls input,.skw-quote-controls select,.skw-quote-field>input{width:100%;box-sizing:border-box;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:11px 10px;background:#fff;color:#0f172a;font-size:14px}
.skw-quote-summary{background:#fff;border:1px solid #cbd5e1;border-radius:16px;padding:16px;margin:18px 0}
.skw-quote-headline{display:grid;gap:4px;padding-bottom:12px;border-bottom:1px solid #e2e8f0;margin-bottom:10px}
.skw-quote-headline span{font-size:13px;color:#64748b}
.skw-quote-headline strong{font-size:30px;color:#1d4ed8}
.skw-quote-warning{font-size:12px;color:#92400e;line-height:1.6;background:#fffbeb;border-radius:9px;padding:10px}
.skw-quote-summary .skw-wired-line strong{white-space:normal;overflow-wrap:anywhere}
.skw-quote-summary .skw-rate-expand{margin-top:12px}
@media(max-width:390px){.skw-quote-controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.skw-quote-controls input,.skw-quote-controls select{font-size:12px;padding:9px 6px}}


/* SKW product-category navigation: compact fixed two-row grid for wireless and wired. */
#content>.skw-product-tabs{
 display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;
 position:sticky;top:calc(var(--brand-height,64px) + 52px);
 z-index:29;background:#f6f7f9;
 padding:7px 2px 8px;margin:0 0 12px;
 border-bottom:1px solid #e4e8ef;
 isolation:isolate;
}
#content>.skw-product-tabs button{
 display:flex;align-items:center;justify-content:center;
 width:100%;min-width:0;min-height:32px;
 padding:7px 3px;border-radius:8px;
 font-size:12.5px;line-height:1.2;white-space:nowrap;
 box-sizing:border-box;
}
#content>.skw-wireless-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
#content>.skw-product-tabs button:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
@media(max-width:370px){
 #content>.skw-product-tabs button{font-size:12px;padding:7px 2px}
}

.policylookup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:8px;row-gap:5px;margin:8px 0}
.policylookup label{font-size:14px;color:#5d6a7c;display:flex;flex-direction:column;gap:5px}
.policylookup select{width:100%;min-width:0;padding:12px 8px;border:1px solid #d9deea;border-radius:9px;background:white;color:#23344a;font-size:15px}
.policylookup label:first-child{grid-column:auto}
.policyresult{border-radius:12px;background:#f3f6fb;padding:12px;font-size:13px;line-height:1.6;margin-bottom:18px}
.policyresult p{margin:3px 0}
.policytoplist{display:grid;gap:9px}
.policytoplist .salescompactcard{display:grid;gap:6px}

<script type="module">
import {mountInventory} from "./inventory-view.js?v=20261103-labels5";
import {mountSales} from "./sales-sync/sales-view.js?v=20261106-sellersearch2";
let stopSales=()=>{};
let mobileDetail=false;
function openMenuPage(key){mobileDetail=true;category=null;render(key);window.scrollTo(0,0)}
const $=id=>document.getElementById(id);
$('homeSession').append(document.querySelector('.session'));
let auth=null,api=null,currentUser=null,mode='welcome',category=null,busy=false;
const titles={products:'상품소개',policy:'정책',sales:'판매',settlement:'정산',inventory:'재고'};

// SKW 내부 화면을 브라우저/WebView 뒤로 가기 기록에 연결
let skwPolicyDetail=null;
let skwRestoringNavigation=false;
let skwNavigationTimer=null;
function skwScreenState(){
 const page=['welcome','login','workspace'].find(id=>!$(id).hidden)||'welcome';
 return {page,mode,menu:activeMenu,category,wirelessFilter,skwWiredCategory,articleOpen,articlePage,selectedPost,
  mobileDetail,policyDetail:skwPolicyDetail};
}
function skwScreenKey(state){
 return JSON.stringify(state);
}
function skwRecordNavigation(){
 if(skwRestoringNavigation)return;
 clearTimeout(skwNavigationTimer);
 skwNavigationTimer=setTimeout(()=>{
  if(skwRestoringNavigation)return;
  const state=skwScreenState(),key=skwScreenKey(state);
  const previous=history.state?.skwScreen;
  if(previous&&skwScreenKey(previous)===key)return;
  if(!previous){history.replaceState({skwScreen:state},'',location.href);return}
  history.pushState({skwScreen:state},'',location.href);
 },0);
}
window.addEventListener('popstate',event=>{
 const state=event.state?.skwScreen;
 if(!state)return;
 clearTimeout(skwNavigationTimer);
 skwRestoringNavigation=true;
 try{
  mode=state.mode==='guest'?'guest':state.mode==='member'?'member':'welcome';
  category=state.category||null;
  wirelessFilter=state.wirelessFilter==='all'?'plans':state.wirelessFilter||'plans';
  skwWiredCategory=state.skwWiredCategory||'plans';
  articleOpen=!!state.articleOpen;
  articlePage=state.articlePage===2?2:1;
  selectedPost=state.selectedPost||'a18';
  mobileDetail=!!state.mobileDetail;
  if(state.page==='workspace'){
   show('workspace');
   // show()는 mobileDetail을 초기화하므로 복원
   mobileDetail=!!state.mobileDetail;
   render(canUseMenu(state.menu)?state.menu:'products');
   if(state.menu==='policy'&&state.policyDetail){
    const detail=policyCategories.find(item=>item[0]===state.policyDetail);
    if(detail&&canViewPolicyCategory(detail[0]))renderPolicySection($('content'),detail[0],detail[1]);
   }
  }else{
   show(state.page==='login'?'login':'welcome');
  }
  window.scrollTo(0,0);
 }finally{
  setTimeout(()=>{skwRestoringNavigation=false},0);
 }
});
let postSearch='';

function skwPlanBenefits(plan){
 const [group,name,,,data,detail,benefit]=plan;
 const items=[];
 if(group==='베스트'){
  const ott=name==='베스트 Max'?'Google AI Pro · YouTube Premium · Netflix Premium · Disney+ Premium · TVING/Wavve Premium':
    name==='베스트 Pro'?'Google AI Plus · YouTube Premium Lite · Netflix Standard · Disney+ Standard · TVING/Wavve Standard':
    name==='베스트 109'?'YouTube Premium Lite · Netflix Standard · Disney+ Standard · TVING/Wavve Standard':
    name==='베스트 99'?'Netflix Standard · Disney+ Standard · TVING/Wavve Standard':'Netflix · Disney+ · TVING/Wavve 구독 할인';
  items.push(['OTT·구독 혜택',ott+(name==='베스트 89'?' (일부 50% 할인)':' · 선택 혜택 1종 기준')]);
  const big=name==='베스트 Max'?'Big 6':name==='베스트 Pro'?'Big 5':name==='베스트 109'?'Big 4':'Big 3';
  items.push(['추가 혜택',big+(name==='베스트 89'?' 50% 할인':' 무료')]);
  if(name==='베스트 Max')items.push(['스마트기기','알뜰폰 월 최대 2.4만원 할인 (제공 자료 표기 기준)']);
  if(name==='베스트 Pro')items.push(['스마트기기','알뜰폰 월 최대 1.8만원 할인 (제공 자료 표기 기준)']);
  if(name==='베스트 109')items.push(['스마트기기','알뜰폰 월 최대 1.2만원 할인 (제공 자료 표기 기준)']);
  items.push(['데이터 공유',detail]);
 }else if(group==='라이트'){
  items.push(['데이터 이용',data+' · '+detail]);
  if(name==='라이트 79')items.push(['스마트기기','스마트기기 1회선 이용요금 50% 할인']);
  if(name.includes('업'))items.push(['데이터플러스','라이트 59 기반 정기충전 데이터가 포함된 맞춤형 요금제']);
  if(benefit)items.push(['추가 혜택',benefit]);
 }else if(group==='기본'){
  items.push(['데이터 이용',data+' · '+detail]);
  items.push(['추가 혜택',benefit]);
  items.push(['음성·문자','요금제별 제공량 및 망내·망외 조건은 원본 자료 확인']);
 }else{
  items.push(['데이터 이용',data+' · '+detail]);
  items.push(['음성·영상통화',benefit]);
  items.push(['가입 조건','어린이 대상 요금제 · 연령 및 전환 조건 확인 필요']);
 }
 return items;
}
function renderRatePlans(root){
 const wrap=document.createElement('section');wrap.className='skw-rate-wrap';
 wrap.innerHTML='<div class="skw-rate-head"><span class="eyebrow">SK텔레콤 · 스마트폰</span><h2>요금제 안내</h2><p>2026년 11월 제공 자료 기준 · 부가세 포함</p></div><div class="skw-rate-groups" role="group" aria-label="요금제 종류"></div><div class="skw-rate-search"><input type="search" aria-label="요금제 검색" placeholder="요금제 이름 검색"></div><div class="skw-rate-results" aria-live="polite"></div><p class="skw-rate-note">※ 할인과 프로모션은 기간·선택 항목·가입 조건 등에 따라 달라질 수 있습니다. 특히 OTT 무료·할인, Big 혜택과 데이터 충전은 가입 전 최신 운영 기준을 확인하세요.</p>';
 root.append(wrap);
 const groups=wrap.querySelector('.skw-rate-groups'),search=wrap.querySelector('input'),results=wrap.querySelector('.skw-rate-results');
 let selected='전체';
 const expanded=new Set();
 const won=n=>Number(n).toLocaleString('ko-KR')+'원';
 function draw(){
  groups.replaceChildren();
  for(const g of ['전체','베스트','라이트','기본','어린이']){
   const b=document.createElement('button');b.type='button';b.textContent=g;b.className=g===selected?'selected':'';b.setAttribute('aria-pressed',String(g===selected));b.onclick=()=>{selected=g;draw()};groups.append(b);
  }
  results.replaceChildren();
  const q=search.value.trim().toLowerCase();
  const visible=skwRatePlans.filter(p=>(selected==='전체'||p[0]===selected)&&(!q||p[1].toLowerCase().includes(q)));
  if(!visible.length){results.textContent='검색 결과가 없습니다.';return}
  for(const p of visible){
   const [group,name,price,discount,data,detail,benefit]=p;
   const card=document.createElement('article');card.className='skw-rate-card';
   const top=document.createElement('div');top.className='skw-rate-cardtop';
   const badge=document.createElement('span');badge.className='skw-rate-tag';badge.textContent=group;
   const title=document.createElement('h3');title.textContent=name;
   top.append(badge,title);
   const money=document.createElement('div');money.className='skw-rate-money';
   money.innerHTML='<span>월정액</span><strong>'+won(price)+'</strong><small>선택약정 적용 '+won(discount)+'</small>';
   const dataEl=document.createElement('div');dataEl.className='skw-rate-data';dataEl.innerHTML='<span>데이터</span><strong></strong><p></p>';dataEl.querySelector('strong').textContent=data;dataEl.querySelector('p').textContent=detail;
   card.append(top,money,dataEl);
   if(benefit){const e=document.createElement('p');e.className='skw-rate-benefit';e.textContent=benefit;card.append(e)}
   const details=document.createElement('div');details.className='skw-rate-detail';
   const button=document.createElement('button');button.type='button';button.className='skw-rate-expand';
   const panel=document.createElement('div');panel.className='skw-rate-expanded';
   const detailId='skw-plan-detail-'+skwRatePlans.indexOf(p);panel.id=detailId;button.setAttribute('aria-controls',detailId);
   for(const [label,value] of skwPlanBenefits(p)){
    const row=document.createElement('div');row.className='skw-rate-detailrow';
    const heading=document.createElement('strong');heading.textContent=label;
    const desc=document.createElement('p');desc.textContent=value;row.append(heading,desc);panel.append(row);
   }
   const caution=document.createElement('p');caution.className='skw-rate-small';caution.textContent='프로모션 적용 기간, 세부 조건, 선택 가능 혜택은 가입 전 확인이 필요합니다.';panel.append(caution);
   function toggle(open){panel.hidden=!open;button.setAttribute('aria-expanded',String(open));button.textContent=open?'혜택·프로모션 접기 ▲':'혜택·프로모션 자세히 보기 ▼';if(open)expanded.add(name);else expanded.delete(name)}
   button.onclick=()=>toggle(panel.hidden);
   details.append(button,panel);card.append(details);toggle(expanded.has(name));
   results.append(card);
  }
 }
 search.oninput=draw;draw();
}

   const match=entries.filter(c=>c[1].toLowerCase().includes(q));

 };

 const settopPrice=s=>Number((s||'0').replace(/[^0-9]/g,''))||0;
 const bundleKey=p=>p[0].includes('광랜')?'basic':p[0].includes('라이트')?'lite':'gigabit';
 function calculate(){

  ])summary.append(skwBuildRow(label,value));

  }else{
   const hint=document.createElement('p');hint.className='skw-quote-warning';hint.textContent='가구 전체 통신비까지 계산하려면 휴대폰 월 요금 합계를 입력하세요.';summary.append(hint);

  const btn=document.createElement('button');btn.type='button';btn.className='skw-rate-expand';btn.textContent='계산 내역 복사';

   ...(mobileNet!==null?['가구 합산 예상 월요금 '+skwPrice(fixedAfter+mobileNet)]:[]),'별도 설치 출동비 참고 '+skwPrice(fee),'※ 실제 청구 조건 확인 필요'].join('\n');
   if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>{btn.textContent='복사 완료'}).catch(()=>{btn.textContent='복사 불가'});else btn.textContent='복사 불가';
  };

function canViewPolicyCategory(id){
 if(id==='common')return true;
 if(isWorkspaceGuest()||mode!=='member'||!currentUser||!canUseMenu('policy'))return false;
 if(isCardAdmin())return true;
 const username=String(memberAccess?.username||currentUser.email?.split('@')[0]||'').toUpperCase();
 if(username.startsWith('D')&&canManageUsers())return true;
 if(id==='retail')return username.startsWith('D');
 if(id==='wholesale')return username.startsWith('P');
 return false;
}

function renderCommonSubsidy(root){
 const sticky=document.createElement('div');sticky.className='policysticky';root.append(sticky);
 const info=document.createElement('p');info.className='note';info.textContent='공통지원금 자료를 불러오는 중…';sticky.append(info);
 const area=document.createElement('div');root.append(area);
 const url='https://sktelecom-w-default-rtdb.asia-southeast1.firebasedatabase.app/publicPolicy/commonSubsidy.json';
 const retailPromise=canViewPolicyCategory('retail')&&currentUser
  ?currentUser.getIdToken().then(token=>fetch('https://sktelecom-w-default-rtdb.asia-southeast1.firebasedatabase.app/retailPolicy.json?auth='+encodeURIComponent(token)).then(r=>r.ok?r.json():null)).catch(()=>null)
  :Promise.resolve(null);
 Promise.all([fetch(url).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}),retailPromise]).then(([data,retail])=>{
  if(!root.isConnected)return;
  if(!data?.plans||!data?.models){info.textContent='공통지원금 자료가 아직 연결되지 않았습니다.';return}
  info.textContent='공통지원금 · '+(data.month||'')+' 기준';info.classList.add('policydate');
  const clean=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9가-힣]/g,'');
  const keys=Object.keys(data.models),basePlans=data.plans,ranked=(data.top||[]).map(x=>x.model);
  const norm=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9가-힣]/g,'');
  const planGroups=data.planGroups||{};
  const groupIndices=new Map(basePlans.map((name,i)=>[norm(name),i]));
  // Only actual tariff names belong in the visible selector; group headers are internal lookup keys.
  const plans=Object.values(data.planNames||{}).filter(Boolean);
  const seenPlans=new Set();
  const visiblePlans=plans.filter(name=>{
   const key=norm(name);
   if(seenPlans.has(key))return false;
   seenPlans.add(key);
   return true;
  });
  const planMatches=visiblePlans.map(name=>{
   const group=planGroups[norm(name)]||name;
   return groupIndices.get(norm(group))??-1;
  });
  function subsidyIndex(planIndex){return planMatches[planIndex]??-1}
  const family=v=>clean(v).replace(/(?:1024|512|256|128|64|32)(?:GB|GW|GG|G)?$|(?:1|2)T(?:B|W)?$/,'');
  keys.sort((a,b)=>{
   const fa=family(a),fb=family(b);
   const rank=f=>{const i=ranked.findIndex(k=>family(k)===f);return i<0?999:i};
   return rank(fa)-rank(fb)||fa.localeCompare(fb,'ko',{numeric:true})||a.localeCompare(b,'ko',{numeric:true});
  });
  const form=document.createElement('div');form.className='policylookup policymultilookup';
  const search=document.createElement('input');search.type='search';search.placeholder='모델명 검색';search.autocomplete='off';search.setAttribute('aria-label','모델명 검색');
  const result=document.createElement('div');result.className='policyresult policyresultslarge';
  const topArea=document.createElement('section');topArea.className='policytoparea';
  const title=document.createElement('h3');title.textContent='T공통지원금 판매 TOP 5';topArea.append(title);
  const list=document.createElement('div');list.className='policytoplist';topArea.append(list);
  const money=n=>n==null?'자료 없음':Number(n).toLocaleString('ko-KR')+'원';
  const types=['010','MNP','기변'];
  const selected={models:new Set(),plans:new Set()};
  form.append(search);
  const modelFilter=document.createElement('select');modelFilter.setAttribute('aria-label','모델 선택');
  function updateModelOptions(){
   const query=clean(search.value),chosen=[...selected.models][0]||'';
   const matches=keys.filter(name=>!query||clean(name).includes(query));
   modelFilter.replaceChildren();
   const first=document.createElement('option');first.value='';first.textContent=query?'검색 결과 '+matches.length+'개 · 모델 선택':'모델 선택';modelFilter.append(first);
   for(const name of matches){const option=document.createElement('option');option.value=name;option.textContent=name;modelFilter.append(option)}
   modelFilter.value=matches.includes(chosen)?chosen:'';
  }
  modelFilter.onchange=()=>{selected.models.clear();if(modelFilter.value)selected.models.add(modelFilter.value);lookup()};
  form.append(modelFilter);
  const planSearch=document.createElement('input');planSearch.type='search';planSearch.placeholder='요금제 검색';planSearch.autocomplete='off';planSearch.setAttribute('aria-label','요금제 검색');
  const planFilter=document.createElement('select');planFilter.setAttribute('aria-label','요금제 선택');
  function updatePlanOptions(){
   const query=clean(planSearch.value),chosen=[...selected.plans][0]||'';
   const matches=visiblePlans.filter(name=>!query||clean(name).includes(query));
   planFilter.replaceChildren();
   const first=document.createElement('option');first.value='';first.textContent=query?'검색 결과 '+matches.length+'개 · 요금제 선택':'요금제 선택';planFilter.append(first);
   for(const name of matches){const option=document.createElement('option');option.value=name;option.textContent=name;planFilter.append(option)}
   planFilter.value=matches.includes(chosen)?chosen:'';
  }
  planFilter.onchange=()=>{selected.plans.clear();if(planFilter.value)selected.plans.add(planFilter.value);lookup()};
  planSearch.oninput=()=>{selected.plans.clear();updatePlanOptions();lookup()};
  form.append(planSearch,planFilter);
  updatePlanOptions();
  sticky.append(form);area.append(result,topArea);
  function lookup(){
   const query=clean(search.value);
   const matches=keys.filter(k=>(!selected.models.size||selected.models.has(k))&&(!query||clean(k).includes(query)));
   const planQuery=clean(planSearch.value);
   const active=!!(selected.models.size||query||selected.plans.size||planQuery);
   topArea.hidden=active;result.replaceChildren();
   if(!active)return;
   if(!matches.length){const p=document.createElement('p');p.className='note';p.textContent='일치하는 모델이 없습니다.';result.append(p);return}
   if(!planQuery&&!selected.plans.size){
    const p=document.createElement('p');p.className='note';p.textContent='요금제를 검색하거나 선택하면 지원금이 표시됩니다.';result.append(p);return;
   }
   if(!selected.models.size&&!query){
    const p=document.createElement('p');p.className='note';p.textContent='지원금을 조회하려면 모델도 검색하거나 선택해 주세요.';result.append(p);return;
   }
   const displayed=matches.slice(0,30);
   const familyCounts=new Map();
   for(const name of displayed)familyCounts.set(family(name),(familyCounts.get(family(name))||0)+1);
   for(const name of displayed){
    const wrapper=document.createElement('details');
    wrapper.className='policyvariant';
    const heading=document.createElement('summary');
    heading.className='policyresultmodel';
    const modelLabel=document.createElement('span');modelLabel.className='policy-model-name';modelLabel.textContent=name;
    const priceLabel=document.createElement('span');priceLabel.className='policy-model-price';priceLabel.textContent='출고가 '+money(data.prices?.[name]);
    heading.append(modelLabel,priceLabel);
    wrapper.append(heading);
    const content=document.createElement('div');content.className='policyvariantcontent';wrapper.append(content);
    result.append(wrapper);
    let found=0;
    for(let i=0;i<visiblePlans.length;i++){
     if(selected.plans.size&&!selected.plans.has(visiblePlans[i]))continue;
     if(planQuery&&!clean(visiblePlans[i]).includes(planQuery))continue;
     const sourceIndex=subsidyIndex(i);
     const values=sourceIndex>=0?data.models[name]?.[sourceIndex]:null;
     const hasValues=Array.isArray(values)&&values.some(v=>v!==null&&v!==undefined);
     if(!hasValues&&sourceIndex>=0)continue;
     if(!hasValues&&!selected.plans.size&&!planQuery)continue;
     found++;
     const card=document.createElement('section');card.className='policyplancard';
     const planTitle=document.createElement('h4');planTitle.textContent=visiblePlans[i];card.append(planTitle);
     const amounts=document.createElement('div');amounts.className='policyplanamounts';
     types.forEach((t,j)=>{
      const cell=document.createElement('div');cell.className='policyplancell';
      const label=document.createElement('span');label.textContent=t;
      const value=document.createElement('strong');value.textContent=money(hasValues?values[j]:null);
      cell.append(label,value);amounts.append(cell);
     });
     card.append(amounts);content.append(card);
    }
    if(!found){const p=document.createElement('p');p.className='note';p.textContent='선택한 조건에 해당하는 지원금 자료가 없습니다.';content.append(p)}
   }
   if(matches.length>displayed.length){const p=document.createElement('p');p.className='note';p.textContent='처음 30개 모델만 표시합니다. 검색어를 더 입력해 주세요.';result.append(p)}
  }
  search.oninput=()=>{selected.models.clear();updateModelOptions();lookup()};
  updateModelOptions();
  for(const [index,item] of (data.top||[]).entries()){
   const card=document.createElement('article');card.className='salescompactcard';
   const name=document.createElement('strong');name.textContent=(index+1)+'. '+item.model;
   const desc=document.createElement('p');desc.textContent='실제 판매 요금제: '+item.plan;
   const amount=document.createElement('div');amount.className='policytopamount';
   const typeLabel=document.createElement('span');typeLabel.textContent='최다 판매 유형 · '+(item.type||'');
   const amountLabel=document.createElement('strong');amountLabel.textContent=money(item.amount);
   amount.append(typeLabel,amountLabel);card.append(name,desc,amount);list.append(card);
  }
  if(!data.top?.length){const empty=document.createElement('p');empty.className='note';empty.textContent='이번 달 T지원금약정 판매 내역이 없습니다.';list.append(empty)}
 }).catch(()=>{if(root.isConnected)info.textContent='공통지원금 데이터를 읽지 못했습니다. 시트 동기화와 공개 읽기 권한을 확인해주세요.'});
}

if(!user||auth.currentUser?.uid!==user.uid||!hasPasswordLogin(user))throw {code:'password/session'};

if(newPassword.length<6)throw {code:'password/short'};
if(oldPassword===newPassword)throw {code:'password/same'};
await api.reauthenticateWithCredential(user,api.EmailAuthProvider.credential(user.email,oldPassword));
if(auth.currentUser?.uid!==user.uid)throw {code:'password/session'};
await api.updatePassword(user,newPassword);
}
