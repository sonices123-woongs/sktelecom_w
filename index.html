<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e94b35"><title>SKW · 세일즈 파트너</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#20252e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ed886b;outline-offset:3px}button:disabled{opacity:.55;cursor:wait}[hidden]{display:none!important}header{height:82px;background:#fff;border-bottom:1px solid #e8eaee;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1080px)/2))}.brand{border:0;background:none;font-weight:900;font-size:29px;letter-spacing:-2px;color:#e94b35}.brand small{margin-left:14px;color:#747b85;font-size:13px;font-weight:500;letter-spacing:0}.quiet{border:1px solid #dde1e7;background:white;padding:10px 16px;border-radius:10px;color:#525b68}main{max-width:1080px;margin:auto;padding:50px 24px 80px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#d34d37}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1.8px;line-height:1.3;margin:18px 0}p{line-height:1.75;color:#737b86}.welcome{max-width:870px;margin:25px auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}.card{border:1px solid #e3e6eb;border-radius:22px;padding:30px;background:white;text-align:left;color:inherit;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:#ec927e}.card strong{display:block;font-size:25px;margin:20px 0 10px;letter-spacing:-.8px}.card p{font-size:15px;margin:0 0 24px}.card .arrow{font-size:14px;font-weight:750;color:#d34d37}.icon{width:52px;height:52px;border-radius:16px;background:#fff0ea;color:#dd5139;display:grid;place-items:center;font-size:25px}.accent{background:#e94b35;border-color:#e94b35;color:white}.accent:hover{border-color:#c73522}.accent p,.accent .arrow{color:#fff0eb}.accent .icon{background:#ffffff24;color:white}.note{font-size:13px;margin-top:24px}.loginbox{max-width:440px;margin:10px auto;background:white;padding:32px;border:1px solid #e3e6eb;border-radius:22px}.loginbox h1{font-size:30px}label{display:block;font-size:14px;font-weight:650;margin:20px 0 8px}input{width:100%;padding:14px;border:1px solid #dce0e6;border-radius:10px;background:#fff}.primary{width:100%;border:0;border-radius:11px;padding:15px;background:#e94b35;color:white;font-weight:750;margin-top:24px}.google{width:100%;margin-top:14px}.back{border:0;background:none;padding:0;color:#707986;font-size:14px}.divider{border-top:1px solid #eceef1;margin-top:26px;padding-top:20px}.error{color:#b72c22;background:#fff0ed;padding:12px;border-radius:10px;font-size:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.tabs button{border:1px solid #e1e5eb;background:white;padding:13px 22px;border-radius:12px;color:#656d78;font-weight:700}.tabs button.active{background:#262e3b;color:white;border-color:#262e3b}.sectiontop{display:flex;justify-content:space-between;align-items:center;gap:16px}.badge{background:#e9edf3;padding:8px 13px;border-radius:30px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.empty{background:white;border:1px solid #e3e6eb;border-radius:20px;padding:48px 26px;text-align:center;margin-top:24px}.empty h2{font-size:22px}.empty p{margin-bottom:0}footer{text-align:center;color:#9ba1ab;font-size:12px;padding:24px}.status{font-size:13px;color:#767e88;margin:12px 0}.session{display:flex;gap:12px;align-items:center}.session span{font-size:13px;color:#737b86}@media(max-width:600px){header{height:68px;padding:0 20px}.brand small{display:none}main{padding:32px 20px 50px}.welcome{margin:18px auto}.choices,.grid{grid-template-columns:1fr;gap:16px}.choices{margin-top:28px}.card{padding:25px}.card strong{margin-top:16px;font-size:23px}.loginbox{padding:25px}.tabs{gap:6px}.tabs button{flex:1;padding:12px 8px;font-size:14px}.session span{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}h1{letter-spacing:-1px}}
.salesheet{background:white;border:1px solid #e3e6eb;border-radius:22px;padding:36px;margin-top:22px}.salesheet h2{font-size:clamp(27px,4vw,38px);letter-spacing:-1px;margin:16px 0 6px}.model{margin:0;font-size:14px}.lead{font-size:24px;line-height:1.5;color:#303947;font-weight:700}.price{border-left:4px solid #e94b35;padding:8px 18px;margin:26px 0}.price span{display:block;color:#737b86;font-size:13px}.price strong{display:block;font-size:34px;margin-top:8px}.specs{margin:0}.specs>div{display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid #e7eaf0;padding:14px 0;gap:16px}.specs dt{font-weight:750}.specs dd{margin:0;line-height:1.6;color:#505b69}.fine,.conditions p{font-size:13px;line-height:1.7}.fine{margin-top:24px}.talk{border-bottom:1px solid #e8ebf0;padding:15px 0}.talk h3{font-size:17px;color:#cc4935;margin:0 0 12px}.talk blockquote{margin:0;color:#3c4655;line-height:1.85;font-size:17px}.conditions{margin-top:24px;padding:20px;background:#f6f7f9;border-radius:12px}.conditions h3{font-size:15px;margin-top:0}.sheetpager{display:flex;align-items:center;justify-content:center;gap:28px;margin:24px 0}.sheetpager button:disabled{cursor:default}.sheetpager span{font-size:14px;color:#6b7480}@media(max-width:600px){.salesheet{padding:24px 20px}.specs>div{grid-template-columns:80px 1fr;gap:12px;font-size:14px}.lead{font-size:21px}.talk blockquote{font-size:16px}} </style></head><body>
<header><button class="brand" id="brand" aria-label="첫 화면으로">SKW<small>당신의 세일즈 파트너</small></button><div class="session"><span id="identity"></span><button class="quiet" id="sessionButton" hidden>로그아웃</button></div></header>
<main>
<section id="welcome" class="welcome"><span class="eyebrow">SALES WORKSPACE</span><h1>상품부터 판매까지,<br>한곳에서 간편하게.</h1><p>상담에 필요한 상품 정보와 세일즈톡을 살펴보세요.<br>발급받은 계정으로 로그인하면 업무 메뉴를 이용할 수 있어요.</p><div class="choices">
<button class="card" id="guest"><span class="icon" aria-hidden="true">↗</span><strong>게스트로 둘러보기</strong><p>로그인 없이 무선·유선 상품과<br>공개 세일즈톡을 확인하세요.</p><span class="arrow">상품소개 둘러보기 →</span></button>
<button class="card accent" id="openLogin"><span class="icon" aria-hidden="true">⌘</span><strong>로그인</strong><p>발급받은 계정으로<br>나의 업무 공간에 접속하세요.</p><span class="arrow">업무 시작하기 →</span></button></div><p class="note">계정은 관리자가 확인한 사용자에게 개별 발급합니다.</p></section>
<section id="login" hidden><div class="loginbox"><button class="back" id="loginBack">← 처음으로</button><h1>로그인</h1><p>관리자에게 받은 아이디로 접속하세요.</p><form id="loginForm"><label for="username">아이디</label><input id="username" autocomplete="username" required maxlength="100" placeholder="발급받은 아이디"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호 입력"><button class="primary authButton" id="submitLogin" disabled>로그인</button></form><p class="status" id="authStatus" role="status">로그인 연결을 준비하고 있어요…</p><p class="error" id="loginError" role="alert" hidden></p><div class="divider"><button class="quiet google authButton" id="googleLogin" disabled>관리자 Google 로그인</button><p class="note">계정 발급·비밀번호 문의는 관리자에게 요청해주세요.</p></div></div></section>
<section id="workspace" hidden><button class="back" id="workspaceBack">← 처음으로</button><div class="sectiontop"><div><p class="eyebrow">SKW WORKSPACE</p><h1 id="workspaceTitle">상품소개</h1></div><span class="badge" id="modeBadge">게스트</span></div><nav class="tabs" id="menu" aria-label="주요 메뉴"></nav><div id="content"></div></section>
</main><footer>SKW · 세일즈 업무 공간</footer>
<script type="module">
const $=id=>document.getElementById(id);
let auth=null,api=null,currentUser=null,mode='welcome',category=null,busy=false;
const titles={products:'상품소개',policy:'정책',sales:'판매',inventory:'재고'};

let wirelessType=null,launchList=false,articleOpen=false,articlePage=1;
function resetProducts(){wirelessType=null;launchList=false;articleOpen=false;articlePage=1}
function action(text,fn,cls='back'){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}
function panel(title,desc,fn){const b=action('',fn,'card');const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.textContent=desc;b.append(h,p);return b}
function renderProducts(root){
if(category==='wired'){root.append(action('← 무선·유선 선택',()=>{category=null;resetProducts();render('products')}));const box=document.createElement('div');box.className='empty';box.innerHTML='<h2>유선 상품 안내 준비 중</h2><p>아직 등록된 자료가 없습니다.</p>';root.append(box);return}
if(!wirelessType){root.append(action('← 무선·유선 선택',()=>{category=null;resetProducts();render('products')}));const grid=document.createElement('div');grid.className='grid';grid.append(panel('단말기','출시 안내와 단말기별 세일즈톡',()=>{wirelessType='devices';render('products')}));root.append(grid);return}
if(!launchList){root.append(action('← 무선 카테고리',()=>{resetProducts();render('products')}));const grid=document.createElement('div');grid.className='grid';grid.append(panel('출시 세일즈톡','단말기 핵심 정보와 상담 포인트',()=>{launchList=true;render('products')}));root.append(grid);return}
if(!articleOpen){root.append(action('← 단말기',()=>{launchList=false;render('products')}));const grid=document.createElement('div');grid.className='grid';grid.append(panel('Galaxy A18 LTE','SM-A185N · 출시 세일즈톡 · 2장 요약',()=>{articleOpen=true;articlePage=1;render('products')}));root.append(grid);return}
root.append(action('← 출시 세일즈톡 목록',()=>{articleOpen=false;render('products')}));
const article=document.createElement('article');article.className='salesheet';
const page1='<span class="eyebrow">출시 세일즈톡 · 01 / 02</span><h2>Galaxy A18 LTE</h2><p class="model">SM-A185N</p><p class="lead">대화면과 대용량 배터리,<br>일상에서 활용하는 AI 기능까지</p><div class="price"><span>출시 자료 기준 출고가 · 부가세 포함</span><strong>425,700원</strong></div><dl class="specs"><div><dt>화면</dt><dd>6.7형 FHD+ Super AMOLED<br>최대 90Hz 주사율</dd></div><div><dt>메모리</dt><dd>RAM 6GB / 저장공간 128GB<br>외장 메모리 최대 2TB 지원 · 별도 구매</dd></div><div><dt>카메라</dt><dd>후면 5,000만 + 500만 + 200만 화소<br>전면 1,300만 화소</dd></div><div><dt>배터리</dt><dd>5,000mAh / 25W 유선 고속 충전 지원</dd></div><div><dt>크기·무게</dt><dd>164.4 × 77.9 × 7.7mm / 196g</dd></div><div><dt>프로세서</dt><dd>엑시노스 1610</dd></div><div><dt>색상</dt><dd>블랙 / 실버 / 라이트블루</dd></div><div><dt>기타</dt><dd>IP64 방수방진 / 삼성 월렛</dd></div></dl><p class="fine">제공된 출시 안내 자료를 요약했습니다. 현재 판매가·지원금·재고는 별도 확인해주세요. 배터리 5,000mAh는 평균값이며 정격 용량은 4,860mAh입니다.</p>';
const page2='<span class="eyebrow">출시 세일즈톡 · 02 / 02</span><h2>상담에서 이렇게 소개하세요</h2><p class="model">Galaxy A18 LTE · 상담용 편집 예시</p><section class="talk"><h3>화면을 중요하게 보는 고객</h3><blockquote>“6.7형 큰 화면이라 영상이나 사진을 보기 편해요. FHD+ Super AMOLED에 최대 90Hz를 지원해 화면을 부드럽게 볼 수 있어요.”</blockquote></section><section class="talk"><h3>검색과 AI 기능을 써보고 싶은 고객</h3><blockquote>“화면에서 궁금한 대상을 동그라미로 표시해 검색하는 서클 투 서치와, 음성이나 측면 버튼으로 부르는 AI 에이전트를 활용할 수 있어요.”</blockquote></section><section class="talk"><h3>배터리와 휴대성을 보는 고객</h3><blockquote>“5,000mAh 배터리에 25W 유선 충전을 지원해요. 두께 7.7mm, 무게 196g으로 일상용 단말기를 찾는 분께 소개할 수 있어요.”</blockquote></section><section class="talk"><h3>사진과 일상 사용을 보는 고객</h3><blockquote>“5,000만 화소 메인 카메라에 초광각·접사 카메라도 있어요. IP64 등급과 삼성 월렛도 지원해요.”</blockquote></section><aside class="conditions"><h3>안내할 때 함께 확인</h3><p>AI 서비스는 국가·언어·기기별 제공 범위가 다르며 인터넷 연결과 Google 계정 로그인이 필요합니다. 제공 자료에서는 18세 이상 이용 및 일부 기능의 계정 호환 조건을 안내합니다.</p><p>IP64는 일상적인 먼지·물 튀김에 대한 보호 등급입니다. 수영장·바닷물 노출은 피하고, 방수 성능은 사용과 마모에 따라 약해질 수 있습니다.</p><p>실제 배터리 사용시간은 환경에 따라 달라집니다. 화면은 둥근 모서리와 카메라 홀 때문에 표기된 대각선 크기보다 실제 표시 영역이 작을 수 있습니다.</p></aside>';
article.innerHTML=articlePage===1?page1:page2;root.append(article);
const pager=document.createElement('nav');pager.className='sheetpager';pager.setAttribute('aria-label','세일즈톡 페이지');const prev=action('← 이전',()=>{articlePage=1;render('products');$('content').scrollIntoView({behavior:'smooth'})},'quiet');prev.disabled=articlePage===1;const info=document.createElement('span');info.textContent=articlePage+' / 2';info.setAttribute('aria-live','polite');const next=action('다음 →',()=>{articlePage=2;render('products');$('content').scrollIntoView({behavior:'smooth'})},'quiet');next.disabled=articlePage===2;pager.append(prev,info,next);root.append(pager);
}

function show(page){for(const id of ['welcome','login','workspace'])$(id).hidden=id!==page;window.scrollTo(0,0)}
function home(){resetProducts();mode='welcome';category=null;show('welcome')}
function workspace(guest=false){resetProducts();mode=guest?'guest':'member';category=null;show('workspace');render('products')}
function render(key){if(mode==='guest'&&key!=='products')key='products';$('workspaceTitle').textContent=titles[key];$('modeBadge').textContent=mode==='guest'?'게스트':'로그인 사용자';$('menu').replaceChildren();for(const [id,title] of Object.entries(titles)){if(mode==='guest'&&id!=='products')continue;const b=document.createElement('button');b.textContent=title;b.className=id===key?'active':'';b.setAttribute('aria-current',id===key?'page':'false');b.onclick=()=>{category=null;render(id)};$('menu').append(b)}
const content=$('content');content.replaceChildren();
if(key==='products'&&!category){const grid=document.createElement('div');grid.className='grid';for(const [type,title,desc,symbol] of [['wireless','무선','무선 상품 안내와 상담에 활용할 세일즈톡','◉'],['wired','유선','인터넷·TV 등 유선 상품과 상담 안내','⌁']]){const b=document.createElement('button');b.className='card';b.innerHTML='<span class="icon" aria-hidden="true">'+symbol+'</span><strong>'+title+'</strong><p>'+desc+'</p><span class="arrow">자세히 보기 →</span>';b.onclick=()=>{resetProducts();category=type;render('products')};grid.append(b)}content.append(grid);return}
if(key==='products'){renderProducts(content);return}
const messages={policy:['정책 자료 준비 중','적용일별 정책과 안내 자료가 이곳에 표시됩니다.'],sales:['내 판매현황 준비 중','판매내역과 월별 실적을 확인할 공간입니다. 정산 기능은 추후 추가됩니다.'],inventory:['재고현황 준비 중','모델·색상별 재고를 확인할 공간입니다.']};
const empty=document.createElement('div');empty.className='empty';const h=document.createElement('h2');h.textContent=messages[key][0];const p=document.createElement('p');p.textContent=messages[key][1];const n=document.createElement('p');n.className='note';n.textContent='현재는 메뉴 확인 단계입니다. 내부 자료와 세부 권한은 아직 연결되지 않았습니다.';empty.append(h,p,n);content.append(empty)}
$('brand').onclick=home;$('loginBack').onclick=home;$('workspaceBack').onclick=home;
$('guest').onclick=()=>workspace(true);$('openLogin').onclick=()=>{if(currentUser)workspace();else show('login')};
function error(e){const messages={'admin-only':'관리자로 지정된 Google 계정을 선택해주세요.','auth/invalid-credential':'아이디 또는 비밀번호를 확인해주세요.','auth/invalid-email':'발급받은 아이디를 확인해주세요.','auth/user-disabled':'사용이 중지된 계정입니다. 관리자에게 문의해주세요.','auth/too-many-requests':'로그인 시도가 많습니다. 잠시 후 다시 시도해주세요.','auth/popup-blocked':'팝업이 차단됐습니다. 이 사이트의 팝업을 허용해주세요.','auth/popup-closed-by-user':'로그인이 취소됐습니다.','auth/unauthorized-domain':'로그인 승인 도메인 설정을 확인해주세요.','auth/network-request-failed':'인터넷 연결을 확인하고 다시 시도해주세요.'};$('loginError').textContent=messages[e.code]||'로그인하지 못했습니다. 잠시 후 다시 시도해주세요.';$('loginError').hidden=false}
async function attempt(fn){if(busy||!auth)return;busy=true;$('loginError').hidden=true;for(const b of document.querySelectorAll('.authButton'))b.disabled=true;try{await fn()}catch(e){error(e)}finally{busy=false;for(const b of document.querySelectorAll('.authButton'))b.disabled=false;$('password').value=''}}
$('loginForm').onsubmit=e=>{e.preventDefault();const id=$('username').value.trim().toLowerCase();if(!/^[a-z0-9][a-z0-9._-]{1,49}$/.test(id)){$('loginError').textContent='아이디는 영문·숫자로 시작하는 2~50자의 영문·숫자·점·밑줄·하이픈을 사용해주세요.';$('loginError').hidden=false;return}attempt(()=>api.signInWithEmailAndPassword(auth,id+'@accounts.skw.invalid',$('password').value))};

$('sessionButton').onclick=async()=>{if(currentUser){try{await api.signOut(auth);home()}catch{alert('로그아웃하지 못했습니다. 다시 시도해주세요.')}}else{show('login')}};
