<!doctype html><html lang="ko"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#f5f6f9;color:#252d39;padding:24px}main{max-width:460px;margin:30px auto;background:white;padding:28px;border-radius:20px}label{display:block;margin:20px 0}input,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;border:1px solid #d9deea;border-radius:10px}button{background:#f04b33;color:white;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.7}#status{white-space:pre-wrap}</style></head><body><main><h1>비밀번호 초기화</h1><p>본인 확인을 마친 사용자의 임시 비밀번호를 지정해주세요. 기존 계정과 권한은 유지됩니다.</p><form id="form"><label>사용자 아이디<input id="username" autocomplete="off" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{1,49}"></label><label>임시 비밀번호<input id="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label><label>임시 비밀번호 확인<input id="confirmation" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label><button id="submit">임시 비밀번호로 초기화</button></form><p id="status" role="status"></p></main><script>
const form=document.getElementById('form'),status=document.getElementById('status'),button=document.getElementById('submit');
form.onsubmit=e=>{e.preventDefault();const username=document.getElementById('username').value.trim(),password=document.getElementById('password'),confirmation=document.getElementById('confirmation');if(password.value!==confirmation.value){status.textContent='비밀번호 확인 값이 일치하지 않습니다.';return}if(!confirm(username+' 계정의 비밀번호를 초기화할까요?'))return;button.disabled=true;status.textContent='처리 중…';google.script.run.withSuccessHandler(message=>{password.value='';confirmation.value='';status.textContent=message;button.disabled=false}).withFailureHandler(error=>{password.value='';confirmation.value='';status.textContent=error.message||'초기화하지 못했습니다.';button.disabled=false}).resetMemberPassword(username,password.value)};
</script></body></html>
